services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microchatservice
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: microchatservice-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
